<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-100px}
#tag{position:absolute;left:0;right:0;top:290px;text-align:center;font-family:'Inter Tight';font-weight:600;font-size:34px;letter-spacing:.34em;color:#e2475d}
#cal{position:absolute;left:290px;top:380px;width:500px;height:440px;border-radius:36px;background:#f3ede4;box-shadow:0 40px 90px rgba(0,0,0,.55);overflow:hidden;transform-origin:50% 50%}
#mon{height:120px;background:#e2475d;color:#fff;font-family:'Onest';font-weight:800;font-size:58px;letter-spacing:.12em;display:flex;align-items:center;justify-content:center}
#day{font-family:'Onest';font-weight:800;font-size:230px;line-height:1;letter-spacing:-.05em;color:#140d0c;text-align:center;margin-top:14px}
#yr{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:44px;color:#7a6c64;letter-spacing:.1em}
#ring1,#ring2{position:absolute;top:-22px;width:26px;height:64px;border-radius:13px;background:#2b2120;border:5px solid #6d5e57}
#ring1{left:120px}#ring2{right:120px}
#bar{position:absolute;left:190px;right:190px;top:880px;height:12px;border-radius:6px;background:rgba(243,237,228,.14);overflow:hidden}
#fill{height:100%;width:0;background:#e2475d;border-radius:6px}
#cnt{position:absolute;left:0;right:0;top:910px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:40px;color:#a89d94;letter-spacing:.06em}
.sc{position:absolute;left:80px;right:80px;top:1000px;text-align:center}
.a{font-family:'Onest';font-weight:800;font-size:100px;line-height:1.06;letter-spacing:-.04em;color:#f3ede4}
.a em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.1em;letter-spacing:-.01em}
.k{font-family:'JetBrains Mono';font-weight:700;font-size:38px;letter-spacing:.2em;color:#e2475d;margin-bottom:26px}
.s{display:block;margin-top:40px;font-family:'Manrope';font-weight:500;font-size:46px;line-height:1.3;color:#a89d94}
.w{display:inline-block;white-space:pre}
#sep{position:absolute;inset:0;background:rgba(120,80,30,.18);mix-blend-mode:color;pointer-events:none}
</style></head><body>
<div id=bg></div>
<div id=tag>ТЫ ЧЕРЕЗ ГОД</div>
<div id=cal><div id=mon>НОЯБРЬ</div><div id=day>10</div><div id=yr>2026</div></div>
<div id=bar><div id=fill></div></div><div id=cnt>день 0 / 365</div>
<div id=stage></div>
<div id=sep></div>
<div id=vig></div><div id=grain></div>
<script>
const S=[
[0,3.2,'<div class=a>через год ты<br>скажешь себе<br><em>спасибо</em></div>'],
[3.2,5.6,'<div class=a>или снова<br>«с понедельника»</div>'],
[5.6,8.0,'<div class=k>01</div><div class=a>начала <em>откладывать</em><br>с любой суммы</div>'],
[8.0,10.4,'<div class=k>02</div><div class=a><em>считала</em> деньги,<br>а не надеялась</div>'],
[10.4,12.8,'<div class=k>03</div><div class=a>делала, когда<br><em>не хотелось</em></div>'],
[12.8,16.4,'<div class=a>год пройдёт<br>в любом случае</div><span class=s>сохрани и открой<br>10 ноября 2027</span>'],
];
const T=16.4;
const M=['НОЯБРЬ','ДЕКАБРЬ','ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ'];
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
const stage=$('stage');
const els=S.map((s,i)=>{const d=document.createElement('div');d.className='sc';d.innerHTML=s[2];
  d.querySelectorAll('.a').forEach(n=>{
    const walk=node=>{[...node.childNodes].forEach(c=>{
      if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}const sp=document.createElement('span');sp.className='w';sp.textContent=t;f.appendChild(sp)});c.replaceWith(f)}
      else if(c.nodeName==='EM'){c.classList.add('w')}
      else if(c.nodeName!=='BR')walk(c)})};walk(n)});
  stage.appendChild(d);return d});
// year progress: from 3.2 to 12.8 days go 0..365
const dayAt=t=>Math.round(365*Math.pow(cl((t-3.2)/9.6),1.15));
let lastM=-1;
window.render=t=>{
  S.forEach((s,i)=>{const d=els[i];const on=t>=s[0]&&t<s[1];d.style.display=on?'block':'none';if(!on)return;
    const lt=t-s[0],dur=s[1]-s[0];
    d.querySelectorAll('.w').forEach((w,k)=>{const st=i===0?0:k*0.1;const p=i===0?1:e((lt-st)/0.36);
      w.style.opacity=p;w.style.filter=`blur(${(1-p)*12}px)`;w.style.transform=`translateY(${(1-p)*30}px)`});
    const kk=d.querySelector('.k');if(kk)kk.style.opacity=e(lt/0.3);
    const sub=d.querySelector('.s');if(sub)sub.style.opacity=e((lt-0.9)/0.5);
    d.style.opacity=1-(i<S.length-1?e((lt-(dur-0.22))/0.22):0);
  });
  const dd=dayAt(t);
  const mi=Math.min(12,Math.floor(dd/30.42));
  const date=new Date(2026,10,10+dd);
  $('mon').textContent=M[(date.getMonth()-10+12)%12];
  $('day').textContent=t<3.2?'10':String(date.getDate());
  if(dd>=365){$('day').textContent='10';$('mon').textContent='НОЯБРЬ'}
  $('yr').textContent=String(date.getFullYear());
  // flip squish on month change
  const ph=(dd/30.42)%1;const sq=(t>3.2&&dd<365)?1-0.12*Math.max(0,1-ph*6):1;
  $('cal').style.transform=`scaleY(${sq}) rotate(${-3+3*cl((t-3.2)/9.6)}deg)`;
  $('fill').style.width=(dd/365*100)+'%';
  $('cnt').textContent=`день ${dd} / 365`;
  // sepia "then" -> clean "now"
  const k=cl((t-3.2)/9.6);
  const warm=[42,28,16],cool=[18,14,16];const c=warm.map((v,j)=>Math.round(v+(cool[j]-v)*k));
  $('bg').style.background=`radial-gradient(ellipse at 50% 30%,rgb(${c}) 0%,#0a0808 70%)`;
  $('bg').style.transform=`scale(${1+t*0.006})`;
  $('sep').style.opacity=1-k;
  $('grain').style.opacity=0.14-0.07*k;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
