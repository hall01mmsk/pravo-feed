<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-60px;background:radial-gradient(ellipse at 30% 20%,#2a1015 0%,#0e0909 55%,#070606 100%)}
#tag{position:absolute;left:90px;top:250px;font-family:'Inter Tight';font-weight:600;font-size:40px;letter-spacing:.22em;color:#e2475d}
#title{position:absolute;left:90px;right:90px;top:320px;font-family:'Onest';font-weight:800;font-size:92px;line-height:1.05;letter-spacing:-.035em}
#title em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;letter-spacing:-.01em}
#pct{position:absolute;left:84px;top:600px;font-family:'Unbounded';font-weight:800;font-size:250px;line-height:1;letter-spacing:-.06em;color:#f3ede4}
#pct small{font-size:120px;color:#e2475d;margin-left:10px}
#bar{position:absolute;left:90px;right:90px;top:900px;height:34px;border-radius:17px;background:#231a1a;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#8e1f33,#e2475d);border-radius:17px;box-shadow:0 0 40px rgba(226,71,93,.6)}
#ticks{position:absolute;left:90px;right:90px;top:950px;display:flex;justify-content:space-between;font-family:'Inter Tight';font-weight:600;font-size:30px;color:#5f5753;letter-spacing:.1em}
#stage{position:absolute;left:90px;right:90px;top:1050px;height:260px}
.st{position:absolute;left:0;right:0;font-family:'Onest';font-weight:800;font-size:76px;line-height:1.08;letter-spacing:-.03em}
.st .k{display:block;font-family:'Inter Tight';font-weight:600;font-size:32px;letter-spacing:.2em;color:#8a817b;margin-bottom:18px}
.st em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d}
</style></head><body>
<div id=bg></div>
<div id=tag>ЗАГРУЗКА…</div>
<div id=title>денежное<br><em>мышление</em></div>
<div id=pct>0<small>%</small></div>
<div id=bar><div id=fill></div></div>
<div id=ticks><span>0</span><span>30</span><span>60</span><span>100</span></div>
<div id=stage></div>
<div id=vig></div><div id=grain></div>
<script>
const S=[[0,0,'0%','«экономлю на всём,<br>даже на <em>себе</em>»'],
[2.8,30,'30%','«записываю,<br>куда <em>ушли</em> деньги»'],
[5.6,60,'60%','«знаю, сколько<br>стоит мой <em>час</em>»'],
[8.6,100,'100%','«покупаю <em>время</em>,<br>а не вещи»'],
[11.4,100,'ГОТОВО','на скольких<br>процентах <em>ты?</em>']];
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
const st=$('stage');S.forEach((s,i)=>{const d=document.createElement('div');d.className='st';d.innerHTML=`<span class=k>${s[2]}</span>${s[3]}`;st.appendChild(d)});
const els=[...st.children];
window.render=t=>{
  let i=0;S.forEach((s,k)=>{if(t>=s[0])i=k});
  // percent: animate from prev to target over 1.2s
  const prev=i?S[i-1][1]:0,tg=S[i][1],lt=t-S[i][0];
  let p=prev+(tg-prev)*e(lt/1.3); if(i===0)p=0;
  // hold at 99 before 100 for tension
  if(i===3&&lt<1.6){p=60+39*e(lt/1.1)} if(i===3&&lt>=1.6)p=100;
  $('pct').innerHTML=Math.round(p)+'<small>%</small>';
  $('fill').style.width=p+'%';
  $('tag').textContent=p>=100?'ЗАГРУЖЕНО ✓':'ЗАГРУЗКА'+'.'.repeat(1+Math.floor(t*3)%3);
  els.forEach((el,k)=>{let a=0,y=0;
    if(k===i){a=k===0?1:e(lt/0.35);y=(1-a)*60}
    else if(k===i-1){const o=e(lt/0.25);a=1-o;y=-60*o}
    el.style.opacity=a;el.style.transform=`translateY(${y}px)`;});
  $('pct').style.transform=`scale(${i===4?1+0.04*Math.sin(lt*6)*Math.exp(-lt):1})`;
  $('bg').style.transform=`scale(${1.03+0.02*Math.sin(t*.4)})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
