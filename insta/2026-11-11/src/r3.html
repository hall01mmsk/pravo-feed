<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-100px;background:radial-gradient(ellipse at 50% 45%,#1e1517 0%,#0c0a0b 55%,#050404 100%)}
#hd{position:absolute;left:70px;right:70px;top:230px;text-align:center;font-family:'Onest';font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-.04em;color:#f3ede4}
#hd em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.12em;letter-spacing:-.01em}
#cnt{position:absolute;left:0;right:0;top:560px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:34px;letter-spacing:.18em;color:#6f6762}
#stage{position:absolute;left:110px;top:640px;width:860px;height:560px;perspective:2200px}
#card{position:absolute;inset:0;transform-style:preserve-3d}
.f{position:absolute;inset:0;border-radius:44px;backface-visibility:hidden;padding:60px 64px;display:flex;flex-direction:column;justify-content:space-between}
.f small{font-family:'JetBrains Mono';font-weight:700;font-size:34px;letter-spacing:.2em}
.f p{font-family:'Onest';font-weight:800;font-size:86px;line-height:1.04;letter-spacing:-.04em}
#fr{background:#2a2426;border:3px solid rgba(243,237,228,.1);filter:sepia(.5)}
#fr small{color:#7c7275}#fr p{color:#8f8588}
#bk{background:#f3ede4;transform:rotateY(180deg);box-shadow:0 30px 120px rgba(226,71,93,.35)}
#bk small{color:#e2475d}#bk p{color:#16110f}
#bk p em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.1em;letter-spacing:-.01em}
#why{position:absolute;left:100px;right:100px;top:1250px;text-align:center;font-family:'Manrope';font-weight:500;font-size:50px;line-height:1.25;color:#d9d0c6}
#end{position:absolute;left:80px;right:80px;top:760px;text-align:center;font-family:'Onest';font-weight:800;font-size:96px;line-height:1.05;letter-spacing:-.04em;opacity:0}
#end em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.12em}
#cta{position:absolute;left:0;right:0;top:1150px;text-align:center;font-family:'Manrope';font-weight:500;font-size:46px;line-height:1.3;color:#b9aea4;opacity:0}
</style></head><body>
<div id=bg></div>
<div id=hd>как ты говоришь<br>о <em>цене</em> — так<br>тебе и платят</div>
<div id=cnt></div>
<div id=stage><div id=card><div class=f id=fr><small>БЫЛО</small><p></p></div><div class=f id=bk><small>СТАЛО</small><p></p></div></div></div>
<div id=why></div><div id=end>цена — это<br>не просьба.<br>это <em>позиция</em>.</div>
<div id=cta>сохрани перед следующим<br>разговором о деньгах</div>
<div id=vig></div><div id=grain></div>
<script>
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const P=[['«извините,<br>это дорого?»','«вот что<br>вы <em>получаете</em>»'],['«ну давайте<br>со скидкой»','«давайте<br><em>добавлю</em> ценность»'],['«сколько<br>не жалко»','«моя цена —<br><em>вот такая</em>»']];
const ST=[0,4.4,8.8],FL=[2.2,6.6,11.0];let cur=-1;const W=['не оправдывайся —<br>говори о результате','скидка учит ждать скидку','назови цифру — и помолчи'];
window.render=t=>{
  let k=0;ST.forEach((s,i)=>{if(t>=s)k=i});
  if(k!==cur){$('fr').querySelector('p').innerHTML=P[k][0];$('bk').querySelector('p').innerHTML=P[k][1];$('why').innerHTML=W[k];cur=k}
  $('cnt').textContent=`0${k+1} / 03`;
  const fp=eio((t-FL[k])/0.55); const ov=Math.sin(Math.PI*cl((t-FL[k])/0.55))*0.06;
  // slide-in new card
  const sin=k===0?1:e((t-ST[k])/0.45);
  const sout=k<2?e((t-ST[k+1]+0.35)/0.35):0;
  $('card').style.transform=`translateX(${(1-sin)*900-sout*900}px) rotateY(${180*fp}deg) scale(${1+ov})`;
  const wp=e((t-FL[k]-0.5)/0.4)*(1-sout);$('why').style.opacity=wp;$('why').style.transform=`translateY(${(1-wp)*30}px)`;
  const out=e((t-13.3)/0.45);
  $('stage').style.opacity=1-out;$('cnt').style.opacity=1-out;
  $('hd').style.opacity=1-out*1;
  const pe=e((t-13.6)/0.5);$('end').style.opacity=pe;$('end').style.transform=`translateY(${(1-pe)*40}px)`;
  $('cta').style.opacity=e((t-14.8)/0.5);
  $('bg').style.transform=`scale(${1+t*0.006})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
