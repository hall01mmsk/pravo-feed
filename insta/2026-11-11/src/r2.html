<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-100px;background:radial-gradient(ellipse at 50% 40%,#1d1417 0%,#0c0a0b 55%,#050404 100%)}
#hd{position:absolute;left:70px;right:70px;top:250px;text-align:center;font-family:'Onest';font-weight:800;font-size:96px;line-height:1.04;letter-spacing:-.04em;color:#f3ede4}
#hd em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.12em;letter-spacing:-.01em}
#mach{position:absolute;left:60px;right:60px;top:560px;height:250px;border-radius:40px;border:4px solid rgba(243,237,228,.16);background:linear-gradient(#141012,#0b0909);display:flex;gap:14px;padding:18px;box-shadow:0 0 0 rgba(226,71,93,0)}
.dr{flex:1;border-radius:24px;background:#f3ede4;overflow:hidden;position:relative}
.dr:after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 30%,transparent 70%,rgba(0,0,0,.55))}
.st{position:absolute;left:0;right:0;top:0}
.w{height:214px;display:flex;align-items:center;justify-content:center;font-family:'Rubik Mono One';font-size:48px;color:#16110f;letter-spacing:-.02em}
#res{position:absolute;left:0;right:0;top:850px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:40px;letter-spacing:.16em}
#list{position:absolute;left:100px;right:90px;top:950px}
.it{margin-bottom:40px;opacity:0}
.it b{display:block;font-family:'Unbounded';font-weight:800;font-size:54px;color:#e2475d;letter-spacing:-.02em}
.it span{display:block;margin-top:6px;font-family:'Manrope';font-weight:500;font-size:50px;line-height:1.2;color:#d9d0c6}
#end{position:absolute;left:80px;right:80px;top:960px;text-align:center;font-family:'Onest';font-weight:800;font-size:92px;line-height:1.06;letter-spacing:-.04em;opacity:0}
#end em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.12em}
#cta{position:absolute;left:0;right:0;top:1250px;text-align:center;font-family:'Manrope';font-weight:500;font-size:46px;color:#b9aea4;opacity:0}
</style></head><body>
<div id=bg></div>
<div id=hd></div>
<div id=mach><div class=dr><div class=st></div></div><div class=dr><div class=st></div></div><div class=dr><div class=st></div></div></div>
<div id=res></div>
<div id=list>
<div class=it><b>план</b><span>у каждого рубля есть задача</span></div>
<div class=it><b>учёт</b><span>знаешь цифры, а не ощущения</span></div>
<div class=it><b>ритм</b><span>делаешь, даже когда не хочется</span></div>
</div>
<div id=end>удача — бонус.<br><em>система</em> — доход.</div>
<div id=cta>сохрани и напиши, что из трёх уже есть</div>
<div id=vig></div><div id=grain></div>
<script>
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
const WS=['авось','потом','повезёт','план','учёт','ритм','лень','завтра','шанс'];
const H=214,N=60;
const st=[...document.querySelectorAll('.st')];
st.forEach((s,k)=>{let h='';for(let i=0;i<N;i++)h+=`<div class=w>${WS[(i+k*3)%9]}</div>`;s.innerHTML=h});
// index in strip where word at (i+k*3)%9 == target
function idx(k,word,after){for(let i=after;i<N;i++)if(WS[(i+k*3)%9]===word)return i;}
const A=['авось','потом','повезёт'],B=['план','учёт','ритм'];
const T1=[0,0,0].map((_,k)=>idx(k,A[k],14+k*3)),T2=[0,0,0].map((_,k)=>idx(k,B[k],T1[k]+18+k*3));
const S1=[1.5,2.0,2.5],S2=[6.0,6.5,7.0],R2=4.6;
function pos(k,t){
  if(t<R2){const p=e(t/S1[k]);return 2+(T1[k]-2)*p}
  const p=e((t-R2)/(S2[k]-R2));return T1[k]+(T2[k]-T1[k])*p;
}
const its=[...document.querySelectorAll('.it')];const IT=[7.8,9.4,11.0];let cur='';
window.render=t=>{
  const hd=t<R2?'ты ставишь<br>на <em>удачу?</em>':'а богатые —<br>на <em>систему</em>';
  if(hd!==cur){$('hd').innerHTML=hd;cur=hd}
  const hp=t<R2?1:e((t-R2)/0.35);$('hd').style.opacity=hp;$('hd').style.filter=`blur(${(1-hp)*10}px)`;
  st.forEach((s,k)=>{const p=pos(k,t),p2=pos(k,t+1/30);const v=Math.abs(p2-p);
    s.style.transform=`translateY(${-(p*H)+0}px)`;s.style.filter=`blur(${Math.min(v*14,12)}px)`});
  // results
  let r='',col='#6f6762';
  if(t>=2.6&&t<R2){r='× ПРОИГРЫШ. КАЖДЫЙ РАЗ';col='#9b8f86'}
  if(t>=7.1){r='✓ ВЫИГРЫШ. КАЖДЫЙ МЕСЯЦ';col='#e2475d'}
  $('res').textContent=r;$('res').style.color=col;
  const win=t>=7.1?e((t-7.1)/0.4):0;
  $('mach').style.borderColor=win?`rgba(226,71,93,${0.3+0.7*win})`:'rgba(243,237,228,.16)';
  $('mach').style.boxShadow=`0 0 ${90*win}px rgba(226,71,93,${0.45*win})`;
  const lose=(t>=2.6&&t<R2)?Math.max(0,1-(t-2.6)*2):0;
  $('mach').style.transform=`translateX(${Math.sin(t*60)*14*lose}px)`;
  const out=e((t-12.9)/0.4);
  its.forEach((el,i)=>{const p=e((t-IT[i])/0.45);el.style.opacity=p*(1-out);el.style.transform=`translateY(${(1-p)*40}px)`});
  const pe=e((t-13.3)/0.5);$('end').style.opacity=pe;$('end').style.transform=`translateY(${(1-pe)*40}px)`;
  $('cta').style.opacity=e((t-14.6)/0.5);
  $('bg').style.transform=`scale(${1+t*0.006})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
