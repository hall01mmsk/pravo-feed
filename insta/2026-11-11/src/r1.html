<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-100px;background:radial-gradient(ellipse at 50% 30%,#22151a 0%,#0c0a0b 55%,#060505 100%)}
#glow{position:absolute;width:1000px;height:700px;left:40px;top:160px;border-radius:50%;background:radial-gradient(circle,rgba(226,71,93,.32),transparent 65%);filter:blur(60px)}
#top{position:absolute;left:0;right:0;top:200px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:40px;letter-spacing:.2em;color:#9b8f86}
#num{position:absolute;left:0;right:0;top:250px;text-align:center;font-family:'Unbounded';font-weight:800;font-size:390px;line-height:1;letter-spacing:-.06em;color:#e2475d;transform-origin:50% 0}
#days{position:absolute;left:0;right:0;top:720px;text-align:center;font-family:'Onest';font-weight:800;font-size:84px;letter-spacing:-.03em;color:#f3ede4}
#days em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.1em}
#bar{position:absolute;left:120px;right:120px;top:860px;height:22px;border-radius:11px;background:rgba(243,237,228,.12);overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#7a2433,#e2475d);border-radius:11px}
#pct{position:absolute;left:120px;right:120px;top:900px;display:flex;justify-content:space-between;font-family:'JetBrains Mono';font-weight:700;font-size:32px;color:#6f6762}
#list{position:absolute;left:110px;right:100px;top:990px}
.it{display:flex;gap:30px;align-items:baseline;margin-bottom:48px;opacity:0}
.it b{font-family:'JetBrains Mono';font-weight:700;font-size:40px;color:#e2475d;min-width:70px}
.it span{font-family:'Manrope';font-weight:800;font-size:62px;line-height:1.14;letter-spacing:-.02em;color:#f3ede4}
.it span i{font-style:normal;color:#9b8f86;font-weight:500}
#end{position:absolute;left:90px;right:90px;top:1000px;text-align:center;font-family:'Onest';font-weight:800;font-size:84px;line-height:1.06;letter-spacing:-.035em;opacity:0}
#end em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.1em}
#cta{position:absolute;left:0;right:0;top:1270px;text-align:center;font-family:'Manrope';font-weight:500;font-size:46px;color:#b9aea4;opacity:0}
</style></head><body>
<div id=bg></div><div id=glow></div>
<div id=top>ДО 2027 ОСТАЛОСЬ</div>
<div id=num>365</div>
<div id=days>дней. <em>хватит,</em> чтобы…</div>
<div id=bar><div id=fill></div></div>
<div id=pct><span>01.01</span><span id=pp>0%</span><span>31.12</span></div>
<div id=list>
<div class=it><b>01</b><span>час в день на навык<br><i>= 50 часов до января</i></span></div>
<div class=it><b>02</b><span>откладывать ежедневно<br><i>= привычка, а не подвиг</i></span></div>
<div class=it><b>03</b><span>1 шаг к доходу в неделю<br><i>= 7 шагов вперёд</i></span></div>
</div>
<div id=end>или ещё 50 дней<br><em>«с понедельника»</em></div>
<div id=cta>сохрани и начни сегодня</div>
<div id=vig></div><div id=grain></div>
<script>
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3),eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const its=[...document.querySelectorAll('.it')];const IT=[3.4,6.2,9.0];
window.render=t=>{
  // count 365 -> 50 over 0..1.6 (frame 0 already shows 50-ish? no: show final at t>=1.6)
  const c=eio(t/1.6); const n=Math.round(365-(315*c)); $('num').textContent=n;
  const fillP=eio(t/1.6)*86.3; $('fill').style.width=fillP+'%'; $('pp').textContent=Math.round(fillP)+'% ГОДА ПОЗАДИ';
  const pulse=t>1.6?1+0.03*Math.sin((t-1.6)*5)*Math.exp(-(t-1.6)*0.6):1;
  // shrink counter when list arrives
  const s=e((t-2.8)/0.6); const sc=(1-0.4*s)*pulse;
  $('num').style.transform=`translateY(${10*s}px) scale(${sc})`;
  $('days').style.transform=`translateY(${-170*s}px)`;$('bar').style.transform=`translateY(${-170*s}px)`;$('pct').style.transform=`translateY(${-170*s}px)`;
  $('days').style.opacity=e((t-1.5)/0.4);
  // list
  const out=e((t-12.2)/0.5);
  its.forEach((el,i)=>{const p=e((t-IT[i])/0.45);el.style.opacity=p*(1-out);el.style.transform=`translateX(${(1-p)*80}px)`;el.style.filter=`blur(${(1-p)*8}px)`});
  $('list').style.transform=`translateY(${-150*s}px)`;
  const pe=e((t-12.6)/0.5);$('end').style.opacity=pe;$('end').style.transform=`translateY(${(1-pe)*40}px) translateY(-110px)`;
  const pc=e((t-14.2)/0.5);$('cta').style.opacity=pc;$('cta').style.transform='translateY(-60px)';
  $('glow').style.opacity=0.7+0.3*Math.sin(t*1.3);
  $('bg').style.transform=`scale(${1+t*0.006})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
