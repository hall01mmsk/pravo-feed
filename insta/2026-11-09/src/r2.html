<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 42%,#1d1213 0%,#0c0909 60%,#060505 100%)}
#hook{position:absolute;left:90px;right:90px;top:430px;font-family:'Onest';font-weight:800;font-size:136px;line-height:1.04;letter-spacing:-.045em}
#hook em,.st em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;letter-spacing:-.01em}
#hook .k{display:block;font-family:'Manrope';font-weight:500;font-size:52px;letter-spacing:0;color:#a89d94;margin-top:40px;line-height:1.3}
#tag{position:absolute;left:90px;top:300px;font-family:'Inter Tight';font-weight:600;font-size:38px;letter-spacing:.26em;color:#e2475d}
#ring{position:absolute;left:250px;top:380px;width:580px;height:580px}
#time{position:absolute;left:0;right:0;top:560px;text-align:center;font-family:'JetBrains Mono';font-weight:700;font-size:190px;letter-spacing:-.04em;color:#f3ede4}
#stage{position:absolute;left:90px;right:90px;top:1030px}
.st{font-family:'Onest';font-weight:800;font-size:88px;line-height:1.06;letter-spacing:-.035em}
.st .k{display:block;font-family:'Manrope';font-weight:500;font-size:48px;line-height:1.3;letter-spacing:0;color:#a89d94;margin-top:26px}
.st .n{display:block;font-family:'Inter Tight';font-weight:600;font-size:34px;letter-spacing:.24em;color:#6f6762;margin-bottom:22px}
</style></head><body>
<div id=bg></div>
<div id=tag>ОДНА ПРИВЫЧКА</div>
<div id=hook>правило<br><em>2 минут</em><br>против «потом»<span class=k>пока идёт таймер — запоминай</span></div>
<svg id=ring viewBox="0 0 580 580"><circle cx=290 cy=290 r=270 fill=none stroke="#2a2020" stroke-width=14 /><circle id=arc cx=290 cy=290 r=270 fill=none stroke="#e2475d" stroke-width=14 stroke-linecap=round transform="rotate(-90 290 290)" stroke-dasharray="1696.5" stroke-dashoffset="0" style="filter:drop-shadow(0 0 18px rgba(226,71,93,.7))"/></svg>
<div id=time>2:00</div>
<div id=stage></div>
<div id=vig></div><div id=grain></div>
<script>
const S=[[2.2,'01','дело на 2 минуты?<br><em>сделай сразу</em>','не записывай, не откладывай'],
[5.4,'02','большое дело?<br><em>начни с 2 минут</em>','открой файл, напиши первую строку'],
[8.6,'03','через 2 минуты<br>можно <em>бросить</em>','но почти всегда продолжаешь'],
[11.8,'','старт важнее<br><em>мотивации</em>','что начнёшь за 2 минуты сегодня?<br>пиши в комментариях']];
const T0=2.2,T1=12.2;
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
let cur=-2;
window.render=t=>{
  const h=t<T0-0.3?1:1-e((t-(T0-0.3))/0.35);
  $('hook').style.opacity=h;$('hook').style.transform=`translateY(${(1-h)*-60}px)`;$('hook').style.display=h<=0?'none':'block';
  const show=e((t-T0+0.05)/0.4);
  ['ring','time','stage'].forEach(i=>$(i).style.opacity=t<T0-0.05?0:show);
  const p=cl((t-T0)/(T1-T0));
  const sec=Math.round(120*(1-p));
  $('time').textContent=Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0');
  $('arc').setAttribute('stroke-dashoffset',(1696.5*p).toFixed(1));
  $('time').style.color=p>=1?'#e2475d':'#f3ede4';
  let i=-1;S.forEach((s,k)=>{if(t>=s[0])i=k});
  if(i!==cur){cur=i;if(i>=0){const s=S[i];$('stage').innerHTML=`<div class=st>${s[1]?`<span class=n>${s[1]} / 03</span>`:''}${s[2]}<span class=k>${s[3]}</span></div>`}else $('stage').innerHTML=''}
  if(i>=0){const lt=t-S[i][0];const a=e((lt-0.1)/0.4);const st=$('stage').firstChild;
    st.style.opacity=a;st.style.transform=`translateY(${(1-a)*40}px)`;st.style.filter=`blur(${(1-a)*10}px)`;
    if(i<3){const ex=e((t-(S[i+1][0]-0.22))/0.22);st.style.opacity=a*(1-ex)}}
  const pulse=1+0.03*Math.max(0,1-((t-T0)%1)/0.25)*(t>T0&&t<T1?1:0);
  $('time').style.transform=`scale(${pulse})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
