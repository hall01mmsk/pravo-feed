<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-120px;background:radial-gradient(ellipse at 50% 38%,#2b1714 0%,#140c0b 45%,#070505 100%)}
#leak{position:absolute;width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,rgba(242,181,107,.30),rgba(226,71,93,.12) 45%,transparent 70%);filter:blur(60px)}
#bar1,#bar2{position:absolute;left:0;right:0;height:150px;background:#000}
#bar1{top:0}#bar2{bottom:0}
#tag{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:'Inter Tight';font-weight:600;font-size:36px;letter-spacing:.34em;color:#e2475d}
.sc{position:absolute;left:80px;right:80px;top:540px;text-align:center}
.a{font-family:'Onest';font-weight:800;font-size:124px;line-height:1.06;letter-spacing:-.04em;color:#f3ede4}
.b{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;font-size:118px;line-height:1.08;color:#f2b56b;letter-spacing:-.01em}
.s{display:block;margin-top:56px;font-family:'Manrope';font-weight:500;font-size:50px;line-height:1.35;color:#a89d94;letter-spacing:0}
.a em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:1.08em;letter-spacing:-.01em}
.w{display:inline-block;white-space:pre}
#num{position:absolute;left:0;right:0;top:1230px;text-align:center;font-family:'Inter Tight';font-weight:600;font-size:34px;letter-spacing:.3em;color:#5e5550}
</style></head><body>
<div id=bg></div><div id=leak></div>
<div id=tag>ЖЁСТКАЯ ПРАВДА</div>
<div id=stage></div>
<div id=num></div>
<div id=bar1></div><div id=bar2></div>
<div id=vig></div><div id=grain></div>
<script>
// [start, end, html]
const S=[
[0,2.6,'<div class=a>никто не придёт<br>тебя <em>спасать</em></div>'],
[2.6,4.8,'<div class=b>и это хорошая<br>новость</div>'],
[4.8,7.1,'<div class=a>не придёт<br>идеальный<br>момент</div>','01'],
[7.1,9.4,'<div class=a>не придёт<br>человек<br>с планом</div>','02'],
[9.4,11.7,'<div class=a>не придёт<br>мотивация<br>по расписанию</div>','03'],
[11.7,14.6,'<div class=a>значит, руль —<br><em>у тебя</em></div><span class=s>сохрани и перечитай<br>в следующий понедельник</span>'],
];
const T=14.6;
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
// prebuild scenes with word spans
const stage=$('stage');
const els=S.map((s,i)=>{const d=document.createElement('div');d.className='sc';d.innerHTML=s[2];
  d.querySelectorAll('.a,.b').forEach(n=>{
    const walk=node=>{[...node.childNodes].forEach(c=>{
      if(c.nodeType===3){const f=document.createDocumentFragment();c.textContent.split(/(\s+)/).forEach(t=>{if(!t)return;if(/^\s+$/.test(t)){f.appendChild(document.createTextNode(t));return}const sp=document.createElement('span');sp.className='w';sp.textContent=t;f.appendChild(sp)});c.replaceWith(f)}
      else if(c.nodeName==='EM'){c.classList.add('w')}
      else if(c.nodeName!=='BR')walk(c)})};walk(n)});
  stage.appendChild(d);return d});
window.render=t=>{
  S.forEach((s,i)=>{const d=els[i];const on=t>=s[0]&&t<s[1];d.style.display=on?'block':'none';if(!on)return;
    const lt=t-s[0],dur=s[1]-s[0];
    const ws=d.querySelectorAll('.w');
    ws.forEach((w,k)=>{const st=i===0?0:k*0.11;const p=i===0?1:e((lt-st)/0.38);
      w.style.opacity=p;w.style.filter=`blur(${(1-p)*14}px)`;w.style.transform=`translateY(${(1-p)*36}px)`});
    const sub=d.querySelector('.s');if(sub){const p=e((lt-0.9)/0.5);sub.style.opacity=p}
    const out=i<S.length-1?e((lt-(dur-0.25))/0.25):0;d.style.opacity=1-out;
    d.style.transform=`scale(${1+lt*0.012})`;
    $('num').textContent=s[3]?s[3]+' / 03':'';
  });
  $('bg').style.transform=`scale(${1+t*0.008})`;
  $('leak').style.left=(-300+t*70)+'px';$('leak').style.top=(200+Math.sin(t*0.6)*160)+'px';
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
