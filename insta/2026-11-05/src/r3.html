<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#1d1314 0%,#0c0a0a 55%,#060505 100%)}
#tag{position:absolute;left:90px;top:330px;font-family:'Inter Tight';font-weight:600;font-size:38px;letter-spacing:.24em;color:#e2475d}
#hook{position:absolute;left:90px;right:90px;top:400px;font-family:'Onest';font-weight:800;font-size:128px;line-height:1.03;letter-spacing:-.04em}
#hook em,#fin em,.res em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;letter-spacing:-.01em}
#box{position:absolute;left:80px;right:80px;top:720px;height:150px;border-radius:75px;background:#171213;border:3px solid #3a2c2e;box-shadow:0 0 0 0 rgba(226,71,93,0)}
#ic{position:absolute;left:52px;top:47px;width:46px;height:46px;border:6px solid #8a817b;border-radius:50%}
#ic:after{content:'';position:absolute;width:6px;height:24px;background:#8a817b;right:-12px;bottom:-20px;transform:rotate(-45deg);border-radius:3px}
#q{position:absolute;left:140px;right:40px;top:0;line-height:150px;font-family:'JetBrains Mono';font-weight:500;font-size:46px;color:#f3ede4;white-space:nowrap;overflow:hidden}
#cur{display:inline-block;width:5px;height:60px;background:#e2475d;vertical-align:middle;margin-left:4px}
#q .bad{color:#8a817b}
#cnt{position:absolute;left:90px;top:640px;font-family:'Inter Tight';font-weight:600;font-size:36px;letter-spacing:.2em;color:#6f6762}
.res{position:absolute;left:90px;right:90px;top:960px;font-family:'Onest';font-weight:800;font-size:84px;line-height:1.07;letter-spacing:-.035em}
.res .k{display:block;font-family:'Manrope';font-weight:500;font-size:46px;line-height:1.3;letter-spacing:0;color:#a89d94;margin-top:26px}
#fin{position:absolute;left:90px;right:90px;top:640px;font-family:'Onest';font-weight:800;font-size:116px;line-height:1.04;letter-spacing:-.04em}
</style></head><body>
<div id=bg></div>
<div id=tag>ТЫ ИЩЕШЬ НЕ ТО</div>
<div id=hook>проблема<br>не в ответах.<br>в <em>вопросе</em></div>
<div id=cnt></div>
<div id=box><div id=ic></div><div id=q></div></div>
<div class=res id=res></div>
<div id=fin>измени <em>вопрос</em><br>— изменится<br>результат</div>
<div id=vig></div><div id=grain></div>
<script>
// start, bad query, good query, result line
const Q=[[1.6,'как экономить на всём','как зарабатывать больше','экономия <em>ограничена.</em><span class=k>рост дохода — нет</span>'],
[5.8,'где найти мотивацию','как построить систему','мотивация <em>уходит.</em><span class=k>система работает и без неё</span>'],
[10.0,'как успеть всё','что можно не делать','фокус — это <em>отказ</em><span class=k>от лишнего, а не скорость</span>']];
const FIN=14.2;
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
const type=(s,p)=>s.slice(0,Math.round(s.length*cl(p)));
let lastRes=-1;
window.render=t=>{
  const s0=Q[0][0];
  const h=t<s0?1:1-e((t-s0)/0.3);
  $('hook').style.opacity=h;$('hook').style.transform=`translateY(${(1-h)*-50}px)`;$('tag').style.opacity=h;
  let i=-1;Q.forEach((q,k)=>{if(t>=q[0])i=k});
  const fin=e((t-FIN)/0.5);
  const show=i<0?0:e((t-s0)/0.4)*(1-fin);
  $('box').style.opacity=show;$('cnt').style.opacity=show;
  $('box').style.transform=`translateY(${(1-e((t-s0)/0.4))*40}px)`;
  const blink=(Math.floor(t*2.2)%2)?1:0;
  if(i>=0){const [st,bad,good,res]=Q[i];const lt=t-st;
    $('cnt').textContent=`ЗАПРОС 0${i+1} / 03`;
    // 0-1.0 type bad, 1.0-1.4 hold, 1.4-1.9 delete, 1.9-2.9 type good
    let txt,cls='';
    if(lt<0.7){txt=type(bad,lt/0.7);cls='bad'}
    else if(lt<1.0){txt=bad;cls='bad'}
    else if(lt<1.35){txt=type(bad,1-(lt-1.0)/0.35);cls='bad'}
    else {txt=type(good,(lt-1.35)/0.7)}
    const typing=(lt<0.7)||(lt>1.0&&lt<2.05);
    $('q').innerHTML=`<span class="${cls}">${txt}</span><span id=cur style="opacity:${typing?1:blink}"></span>`;
    const g=lt>2.05?e((lt-2.05)/0.3):0;
    $('box').style.borderColor=g>0?`rgba(226,71,93,${0.3+0.7*g})`:'#3a2c2e';
    $('box').style.boxShadow=`0 0 ${60*g}px rgba(226,71,93,${0.35*g})`;
    if(lastRes!==i){lastRes=i;$('res').innerHTML=res}
    const r=e((lt-2.2)/0.4);const nx=i<2?Q[i+1][0]:FIN;const ex=e((t-(nx-0.25))/0.25);
    $('res').style.opacity=r*(1-ex);$('res').style.transform=`translateY(${(1-r)*40}px)`;$('res').style.filter=`blur(${(1-r)*8}px)`;
  } else {$('res').style.opacity=0}
  $('fin').style.opacity=fin;$('fin').style.transform=`translateY(${(1-fin)*40}px)`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
