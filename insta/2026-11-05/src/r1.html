<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#22100f 0%,#0d0909 60%,#070606 100%)}
#tag{position:absolute;left:90px;top:330px;font-family:'Inter Tight';font-weight:600;font-size:38px;letter-spacing:.24em;color:#e2475d}
#hook{position:absolute;left:90px;right:90px;top:420px;font-family:'Onest';font-weight:800;font-size:132px;line-height:1.04;letter-spacing:-.04em}
#hook em,.st em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;letter-spacing:-.01em}
#lbl{position:absolute;left:90px;top:410px;font-family:'Inter Tight';font-weight:600;font-size:40px;letter-spacing:.3em;color:#8a817b}
#num{position:absolute;left:74px;top:470px;font-family:'Unbounded';font-weight:800;font-size:400px;line-height:1;letter-spacing:-.07em;color:#f3ede4}
#track{position:absolute;left:90px;right:90px;top:950px;height:6px;background:#2a2020;border-radius:3px}
#fill{position:absolute;left:0;top:0;height:6px;width:0;background:#e2475d;border-radius:3px;box-shadow:0 0 30px rgba(226,71,93,.7)}
.dot{position:absolute;top:-13px;width:32px;height:32px;margin-left:-16px;border-radius:50%;background:#0d0909;border:5px solid #3a2e2e}
.dot.on{border-color:#e2475d;background:#e2475d;box-shadow:0 0 30px rgba(226,71,93,.8)}
.dl{position:absolute;top:40px;transform:translateX(-50%);font-family:'Inter Tight';font-weight:600;font-size:32px;color:#6f6762;letter-spacing:.06em;white-space:nowrap}
#stage{position:absolute;left:90px;right:90px;top:1090px}
.st{font-family:'Onest';font-weight:800;font-size:96px;line-height:1.06;letter-spacing:-.035em}
.st .k{display:block;font-family:'Manrope';font-weight:500;font-size:48px;line-height:1.3;letter-spacing:0;color:#a89d94;margin-top:28px}
</style></head><body>
<div id=bg></div>
<div id=tag>ДИСЦИПЛИНА</div>
<div id=hook>что меняется<br>за <em>100 дней</em><br>дисциплины</div>
<div id=lbl>ДЕНЬ</div><div id=num>1</div>
<div id=track><div id=fill></div></div>
<div id=stage></div>
<div id=vig></div><div id=grain></div>
<script>
const S=[[2.0,1,'тяжело <em>всё</em>','каждое утро — спор с собой.<br>это нормально.'],
[4.9,7,'появляется <em>ритм</em>','ты перестаёшь ждать настроения'],
[7.8,30,'меньше <em>торга</em>','делаешь, потому что это твой режим'],
[10.7,100,'это уже <em>ты</em>','не «заставляю себя», а «я так живу»'],
[13.4,100,'','']];
const marks=[1,7,30,100];
const $=id=>document.getElementById(id),cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
const tr=$('track');marks.forEach(m=>{const d=document.createElement('div');d.className='dot';d.style.left=(m-1)/99*100+'%';d.innerHTML=`<div class=dl>${m}</div>`;tr.appendChild(d)});
const dots=[...document.querySelectorAll('.dot')];
let cur=-2;
window.render=t=>{
  const s0=S[0][0];
  const h=t<s0?1:1-e((t-s0)/0.35);
  $('hook').style.opacity=h;$('hook').style.transform=`translateY(${(1-h)*-50}px)`;
  $('hook').style.display=h<=0?'none':'block';
  const show=e((t-s0-0.1)/0.4);
  ['lbl','num','track','stage'].forEach(i=>$(i).style.opacity=t<s0?0:show);
  $('tag').style.opacity=t<s0?1:show;
  // day value: interpolate between stages
  let i=-1;S.forEach((s,k)=>{if(t>=s[0])i=k});
  let day=1;
  if(i>=0){const a=S[i],b=S[Math.min(i+1,S.length-1)];const p=e((t-a[0])/0.9);
    day=i<3?Math.round(a[1]+(b[1]-a[1])*0)+0:100;
    // count up quickly at stage start from previous value
    const prev=i>0?S[i-1][1]:1;day=Math.round(prev+(a[1]-prev)*p);}
  $('num').textContent=day;
  $('fill').style.width=((day-1)/99*100)+'%';
  dots.forEach((d,k)=>d.classList.toggle('on',day>=marks[k]));
  if(i!==cur){cur=i;
    if(i>=0&&i<4) $('stage').innerHTML=`<div class=st>${S[i][2]}<span class=k>${S[i][3]}</span></div>`;
    if(i===4) $('stage').innerHTML=`<div class=st>какой день<br>у <em>тебя?</em><span class=k>напиши цифру в комментариях</span></div>`;
  }
  if(i>=0){const lt=t-S[i][0];const a=e((lt-0.15)/0.4);const st=$('stage').firstChild;
    if(st){st.style.opacity=a;st.style.transform=`translateY(${(1-a)*40}px)`;st.style.filter=`blur(${(1-a)*10}px)`}
    const nx=i<4?S[i+1][0]:99;const ex=e((t-(nx-0.22))/0.22);if(st&&i<4)st.style.opacity=a*(1-ex);}
  $('num').style.transform=`scale(${1+0.04*Math.max(0,1-((t-(S[Math.max(i,0)][0]))/0.5))})`;$('num').style.transformOrigin='left center';
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
