<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#glow{position:absolute;width:1300px;height:1300px;left:-110px;top:120px;border-radius:50%;background:radial-gradient(circle,rgba(226,71,93,.30),transparent 65%);filter:blur(40px)}
#bat{position:absolute;left:90px;top:250px;width:300px;height:140px;border:8px solid #f3ede4;border-radius:28px;padding:10px}
#bat:after{content:'';position:absolute;right:-30px;top:38px;width:16px;height:48px;background:#f3ede4;border-radius:0 8px 8px 0}
#fill{height:100%;border-radius:14px;background:#e2475d;width:2%}
#pct{position:absolute;left:440px;top:236px;font-family:'Oswald';font-weight:700;font-size:150px;line-height:1;letter-spacing:-.01em}
#hd{position:absolute;left:90px;right:90px;top:450px;font-family:'Oswald';font-weight:700;font-size:92px;line-height:1.14;text-transform:uppercase;letter-spacing:.005em}
#hd small{display:block;font-family:'Manrope';font-weight:500;font-size:44px;text-transform:none;color:#b9aea4;margin-top:24px;letter-spacing:0}
#list{position:absolute;left:90px;right:90px;top:760px}
.it{display:flex;gap:34px;align-items:flex-start;margin-bottom:38px;font-family:'Manrope';font-weight:800;font-size:50px;line-height:1.12;letter-spacing:-.02em}
.bx{flex:0 0 70px;height:70px;border:5px solid #6f6762;border-radius:18px;position:relative;margin-top:-4px}
.bx svg{position:absolute;inset:6px}
.bx path{stroke:#0b0909;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
#fin{position:absolute;left:90px;right:90px;top:1330px;font-family:'Manrope';font-weight:500;font-size:44px;color:#b9aea4;opacity:0}
</style></head><body><div id=glow></div>
<div id=bat><div id=fill></div></div><div id=pct>1%</div>
<div id=hd>заряди свой<br>денежный уровень<small id=sub>4 привычки — по 25% каждая</small></div>
<div id=list></div>

<div id=vig></div><div id=grain></div>
<script>
const I=["сначала откладываешь,<br>потом тратишь","знаешь цену<br>своего часа","учишься до того,<br>как начался день","говоришь «нет» тому,<br>что не растит"];
const A=2.2,D=2.4;
const L=document.getElementById('list');
I.forEach(s=>L.insertAdjacentHTML('beforeend',`<div class=it><div class=bx><svg viewBox="0 0 48 48"><path d="M10 25 L20 35 L39 13"/></svg></div><div>${s}</div></div>`));
const its=[...document.querySelectorAll('.it')];
const e=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const $=id=>document.getElementById(id);
window.render=t=>{
  let level=1;
  its.forEach((it,i)=>{const a=A+i*D;
    const ap=e((t-a+0.9)/0.4); it.style.opacity=t<A-0.9?0:Math.max(0.25,ap)*(t>=a?1:0.45)/(t>=a?1:1);
    it.style.transform=`translateY(${30*(1-ap)}px)`;
    const ck=e((t-a)/0.3); const bx=it.querySelector('.bx'),p=it.querySelector('path');
    p.style.strokeDashoffset=60*(1-ck);
    bx.style.background=ck>0?`rgba(226,71,93,${ck})`:'transparent'; bx.style.borderColor=ck>0?'#e2475d':'#6f6762';
    bx.style.transform=`scale(${1+0.25*Math.sin(Math.PI*Math.min(Math.max((t-a)/0.3,0),1))})`;
    if(t>=a) level=1+99*Math.min((i+e((t-a)/0.5))/4,1);
  });
  level=Math.round(level);
  $('pct').textContent=level+'%';
  $('fill').style.width=Math.max(2,level)+'%';
  $('fill').style.background=level>=100?'#c6f432':'#e2475d';
  $('pct').style.color=level>=100?'#c6f432':'#f3ede4';
  const hp=e(t/0.5);$('hd').style.opacity=hp;
  // 1% blink at start
  $('bat').style.opacity=(t<A&&Math.floor(t*3)%2)?0.35:1;
  const fe=t>A+4*D+0.4;$('sub').textContent=fe?'на сколько ты заряжена? сохрани':'4 привычки — по 25% каждая';$('sub').style.color=fe?'#c6f432':'#b9aea4';
  $('glow').style.transform=`translate(${Math.sin(t*.5)*60}px,${Math.cos(t*.4)*90}px)`;
  $('glow').style.background=level>=100?'radial-gradient(circle,rgba(198,244,50,.18),transparent 65%)':'';
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
