<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bgT{position:absolute;left:0;right:0;top:0;height:820px;background:linear-gradient(180deg,#141212,#1a1717)}
#bgB{position:absolute;left:0;right:0;top:820px;bottom:0;background:radial-gradient(ellipse at 50% 20%,rgba(226,71,93,.35),rgba(120,10,30,.15) 50%,#0b0909 80%)}
#line{position:absolute;left:0;right:0;top:818px;height:4px;background:#e2475d;transform-origin:0 50%}
.lab{position:absolute;left:90px;font-family:'Inter Tight';font-weight:600;font-size:36px;letter-spacing:.24em;text-transform:uppercase}
#lt{top:300px;color:#7d746d}#lb{top:880px;color:#e2475d}
.ph{position:absolute;left:90px;right:90px;font-family:'Unbounded';font-weight:800;font-size:84px;line-height:1.08;letter-spacing:-.03em}
.pt{top:380px;color:#8f8680}.pb{top:960px;color:#f3ede4}
#hook{position:absolute;left:90px;right:90px;top:430px;font-family:'Unbounded';font-weight:800;font-size:104px;line-height:1.04;letter-spacing:-.04em}
#hook em{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;color:#e2475d;font-size:150px;letter-spacing:-.01em}
#hook small{display:block;margin-top:60px;font-family:'Inter Tight';font-weight:600;font-size:46px;letter-spacing:0;color:#b9aea4}
#fin{position:absolute;left:90px;right:90px;top:520px;font-family:'Unbounded';font-weight:800;font-size:96px;line-height:1.06;letter-spacing:-.04em}
#fin em{font-family:'Cormorant Garamond';font-style:italic;color:#e2475d;font-size:140px}
#fin small{display:block;margin-top:60px;font-family:'Inter Tight';font-weight:600;font-size:46px;color:#b9aea4;letter-spacing:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#cnt{position:absolute;right:90px;top:300px;font-family:'Inter Tight';font-weight:600;font-size:36px;color:#7d746d;letter-spacing:.1em}
</style></head><body>
<div id=bgT></div><div id=bgB></div><div id=line></div>
<div class=lab id=lt>бедное мышление</div><div id=cnt></div>
<div class=lab id=lb>богатое мышление</div>
<div id=pairs></div>
<div id=hook>бедное<br>vs <em>богатое</em><br>мышление<small>узнай себя за 15 секунд</small></div>
<div id=fin>какая фраза<br>звучит <em>в твоей</em><br>голове?<small>напиши в комментариях: 1, 2, 3 или 4</small></div>
<div id=vig></div><div id=grain></div><div id=flash></div>
<script>
const P=[["«сколько это<br>стоит?»","«сколько это<br>мне принесёт?»"],
["«сделаю сам —<br>сэкономлю»","«делегирую —<br>куплю время»"],
["«заработаю —<br>потрачу»","«заработаю —<br>вложу»"],
["«жду<br>вдохновения»","«работаю<br>по расписанию»"]];
const H=2.4,D=2.6,F=H+D*4;const T=15;
const box=document.getElementById('pairs');
P.forEach(p=>{box.insertAdjacentHTML('beforeend',`<div class="ph pt">${p[0]}</div><div class="ph pb">${p[1]}</div>`)});
const tops=[...document.querySelectorAll('.pt')],bots=[...document.querySelectorAll('.pb')];
const e=x=>1-Math.pow(1-Math.min(Math.max(x,0),1),3);
const $=id=>document.getElementById(id);
window.render=t=>{
  const inPairs=t>=H&&t<F;
  ['lt','lb','line','bgT','cnt'].forEach(i=>$(i).style.opacity=inPairs?1:0);
  $('bgB').style.top=inPairs?'820px':'0px';
  // hook
  const hp=e(t/0.5), ho=e((t-(H-0.25))/0.25);
  $('hook').style.opacity=t<H?hp*(1-ho):0; $('hook').style.transform=`scale(${1.08-0.08*hp})`;
  // pairs
  let fl=0;
  P.forEach((_,i)=>{const a=H+i*D,b=a+D;
    const on=t>=a&&t<b;
    const pt=e((t-a)/0.35), pb=e((t-a-0.9)/0.35), out=e((t-(b-0.2))/0.2);
    tops[i].style.opacity=on?pt*(1-out):0; bots[i].style.opacity=on?pb*(1-out):0;
    tops[i].style.transform=`translateX(${-60*(1-pt)}px)`;
    bots[i].style.transform=`translateX(${60*(1-pb)}px) scale(${1+0.06*Math.max(0,1-(t-a-0.9)/0.3)*(pb>0?1:0)})`;
    const d=t-(a+0.9); if(d>=0&&d<0.12) fl=Math.max(fl,0.35*(1-d/0.12));
    const d2=t-a; if(i>0&&d2>=0&&d2<0.1) fl=Math.max(fl,0.25*(1-d2/0.1));
    if(on) $('cnt').textContent=`0${i+1} / 04`;
  });
  $('line').style.transform=`scaleX(${inPairs?((t-H)%D)/D:0})`;
  const d3=t-F; if(d3>=0&&d3<0.12) fl=Math.max(fl,0.4*(1-d3/0.12));
  $('flash').style.opacity=fl;
  const fp=e((t-F)/0.5);$('fin').style.opacity=t>=F?fp:0;$('fin').style.transform=`translateY(${40*(1-fp)}px)`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
