<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:-80px;background:linear-gradient(160deg,#160d0f 0%,#0a0808 45%,#1b0a0e 100%)}
#beam{position:absolute;width:1400px;height:500px;left:-200px;top:700px;background:linear-gradient(90deg,transparent,rgba(226,71,93,.28),transparent);filter:blur(70px);transform:rotate(-18deg)}
#lb1,#lb2{position:absolute;left:0;right:0;height:170px;background:#000}#lb1{top:0}#lb2{bottom:0}
#pov{position:absolute;left:90px;top:330px;font-family:'Inter Tight';font-weight:600;font-size:46px;letter-spacing:.2em;color:#e2475d}
#stage{position:absolute;left:90px;right:90px;top:440px}
.w{display:inline-block;margin-right:.24em}
.l{font-family:'Onest';font-weight:800;font-size:104px;line-height:1.08;letter-spacing:-.035em}
.l em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;letter-spacing:-.01em}
.l.dim{color:#7d746d}
#rgbR,#rgbB{position:absolute;inset:0;mix-blend-mode:screen;pointer-events:none}
#sub{position:absolute;left:90px;right:90px;top:1180px;font-family:'Manrope';font-weight:500;font-size:46px;line-height:1.3;color:#b9aea4}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id=bg></div><div id=beam></div>
<div id=pov>POV:</div>
<div id=stage></div><div id=sub></div>
<div id=vig></div><div id=grain></div><div id=lb1></div><div id=lb2></div><div id=flash></div>
<script>
// scenes: [start, lines(html), sub]
const S=[
 [0,  ['ты поняла,','за что <em>на самом</em>','<em>деле</em> платят'], 'и перестала работать больше ради большего'],
 [2.6,['не за часы.'],''],
 [3.9,['не за часы.','<span class=dim>не за усилия.</span>'],''],
 [5.2,['платят','за <em>решённую</em>','проблему.'],'клиенту всё равно, сколько ты старалась'],
 [8.0,['чем дороже','проблема —','тем <em>выше чек.</em>'],'расти = брать задачи сложнее, а не дольше'],
 [11.0,['какую','проблему','решаешь <em>ты?</em>'],'напиши одним словом в комментариях 👇'],
];
const T=14,$=id=>document.getElementById(id);
const cl=x=>Math.min(Math.max(x,0),1),e=x=>1-Math.pow(1-cl(x),3);
let cur=-1;
function build(i){
  const st=$('stage');st.innerHTML='';
  S[i][1].forEach((ln,li)=>{const d=document.createElement('div');d.className='l';
    // split words, keep tags
    const tmp=document.createElement('div');tmp.innerHTML=ln;
    const words=[];tmp.childNodes.forEach(n=>{if(n.nodeType===3){n.textContent.split(/\s+/).filter(Boolean).forEach(w=>words.push(w))}else{const h=n.outerHTML; n.textContent.split(/\s+/).filter(Boolean).forEach(w=>{const c=n.cloneNode();c.textContent=w;words.push(c.outerHTML)})}});
    d.innerHTML=words.map(w=>`<span class=w>${w}</span>`).join('');st.appendChild(d)});
  $('sub').textContent=S[i][2];
}
window.render=t=>{
  let i=0;for(let k=0;k<S.length;k++) if(t>=S[k][0]) i=k;
  if(i!==cur){build(i);cur=i}
  const lt=t-S[i][0];
  const ws=[...document.querySelectorAll('.w')];
  const keep=(i===2)?2:0; // scene 2 keeps first line visible
  ws.forEach((w,k)=>{
    let a; if(i===0) a=1; else if(k<keep) a=1; else a=e((lt-(k-keep)*0.13)/0.16);
    w.style.opacity=a; w.style.transform=`translateY(${(1-a)*50}px) scale(${1+0.25*(1-a)})`;
    w.style.filter=a<1?`blur(${(1-a)*10}px)`:'none';
  });
  $('sub').style.opacity=i===0?1:e((lt-0.7)/0.3);
  // glitch on cut
  let g=0; if(i>0&&lt<0.18) g=1-lt/0.18;
  const st=$('stage');
  st.style.textShadow=g>0?`${-14*g}px 0 rgba(255,40,80,.9), ${14*g}px 0 rgba(40,220,255,.8)`:'none';
  st.style.transform=g>0?`translateX(${(Math.sin(t*90)*18)*g}px) skewX(${-6*g}deg)`:'none';
  $('flash').style.opacity=(i>0&&lt<0.08)?0.28*(1-lt/0.08):0;
  $('pov').style.opacity=i===0?1:0.0;
  $('beam').style.transform=`rotate(-18deg) translateX(${Math.sin(t*.45)*120}px)`;
  $('bg').style.transform=`scale(${1.04+0.02*Math.sin(t*.3)})`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
