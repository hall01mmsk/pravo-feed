<!doctype html><html><head><meta charset=utf-8><link rel=stylesheet href=common.css><style>
#bg{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 30%,#2a1216 0%,#120c0c 55%,#090707 100%)}
#glow{position:absolute;left:90px;right:90px;top:520px;height:700px;border-radius:50%;background:radial-gradient(circle,rgba(226,71,93,.45),transparent 65%);filter:blur(60px)}
.lab{position:absolute;left:90px;font-family:'Inter Tight';font-weight:600;font-size:38px;letter-spacing:.22em;text-transform:uppercase;color:#8f8680}
#hook{position:absolute;left:90px;right:90px;top:470px}
#hook .b{font-family:'Unbounded';font-weight:800;font-size:300px;line-height:.9;letter-spacing:-.06em;color:#e2475d}
#hook .t{font-family:'Unbounded';font-weight:800;font-size:92px;line-height:1.05;letter-spacing:-.035em;margin-top:30px}
#hook .s{font-family:'Inter Tight';font-weight:600;font-size:46px;color:#b9aea4;margin-top:50px}
#cnt{position:absolute;left:90px;right:90px;top:470px}
#day{font-family:'Inter Tight';font-weight:600;font-size:44px;letter-spacing:.14em;color:#8f8680;text-transform:uppercase}
#num{font-family:'Unbounded';font-weight:800;font-size:250px;line-height:1;letter-spacing:-.05em;margin-top:40px;font-variant-numeric:tabular-nums}
#num small{font-size:120px;color:#e2475d}
#formula{font-family:'Playfair Display';font-style:italic;font-weight:700;font-size:80px;color:#e2475d;margin-top:30px}
#bar{position:relative;height:14px;background:rgba(255,255,255,.08);margin-top:70px;border-radius:7px;overflow:hidden}
#fill{position:absolute;left:0;top:0;bottom:0;background:#e2475d;border-radius:7px}
#cap{font-family:'Manrope';font-weight:500;font-size:48px;line-height:1.3;color:#b9aea4;margin-top:60px}
#cap b{color:#f3ede4;font-weight:800}
#fin{position:absolute;left:90px;right:90px;top:500px;font-family:'Unbounded';font-weight:800;font-size:100px;line-height:1.05;letter-spacing:-.04em}
#fin em{font-family:'Playfair Display';font-style:italic;font-weight:700;color:#e2475d;font-size:130px;letter-spacing:-.01em}
#fin small{display:block;margin-top:70px;font-family:'Inter Tight';font-weight:600;font-size:46px;color:#b9aea4;letter-spacing:0}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style></head><body>
<div id=bg></div><div id=glow></div>
<div id=hook><div class=b>1%</div><div class=t>в день — это<br>не мало.</div><div class=s>посмотри, во что он превращается за год</div></div>
<div id=cnt><div id=day></div><div id=num></div><div id=formula></div><div id=bar><div id=fill></div></div><div id=cap></div></div>
<div id=fin>разница —<br>в одном<br><em>проценте.</em><br>каждый день.<small>сохрани и начни свой 1% сегодня</small></div>
<div id=vig></div><div id=grain></div><div id=flash></div>
<script>
const $=id=>document.getElementById(id);
const cl=x=>Math.min(Math.max(x,0),1), e=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const fmt=v=>v.toFixed(2).replace('.',',');
const H=2.3,U0=H,U1=7.6,D0=7.9,D1=11.3,F=11.6;
window.render=t=>{
  // hook visible from frame 0
  const hk=t<H; $('hook').style.opacity=hk?1-e((t-(H-.25))/.25):0;
  $('hook').style.transform=`scale(${1+0.03*t/H})`;
  const up=t>=U0&&t<D1; $('cnt').style.opacity=up?1:0;
  let fl=0;
  if(t>=U0&&t<D0){
    const p=eio((t-U0-.2)/(U1-U0-.6)); const d=Math.round(1+364*p); const v=Math.pow(1.01,d);
    $('day').textContent=`+1% каждый день · день ${d}`;
    $('num').innerHTML=fmt(v)+'<small>×</small>'; $('num').style.color='#f3ede4';
    $('formula').textContent='1,01³⁶⁵ ≈ 37,8';$('formula').style.color='#e2475d';
    $('fill').style.width=(100*p)+'%';$('fill').style.background='#e2475d';
    $('cap').innerHTML='маленький шаг, повторённый 365 раз, даёт <b>в 37 раз больше</b>';
    $('cap').style.opacity=e((t-U1+1.2)/.4);
    $('num').style.transform=`scale(${1+0.04*Math.sin(t*6)*(p<1?1:0)})`;
    const d0=t-U0; if(d0<.12) fl=.35*(1-d0/.12);
  } else if(t>=D0&&t<D1){
    const p=eio((t-D0-.2)/(D1-D0-.9)); const d=Math.round(1+364*p); const v=Math.pow(0.99,d);
    $('day').textContent=`−1% каждый день · день ${d}`;
    $('num').innerHTML=fmt(v)+'<small style="color:#6f6762">×</small>'; $('num').style.color='#6f6762';$('num').style.transform='none';
    $('formula').textContent='0,99³⁶⁵ ≈ 0,03';$('formula').style.color='#8f8680';
    $('fill').style.width=(100*(1-p))+'%';$('fill').style.background='#4a4340';
    $('cap').innerHTML='а «чуть-чуть расслабиться» каждый день — <b>почти ноль</b>';
    $('cap').style.opacity=e((t-D1+1.4)/.4);
    const d0=t-D0; if(d0<.12) fl=.45*(1-d0/.12);
  }
  $('fin').style.opacity=t>=F?e((t-F)/.45):0; $('fin').style.transform=`translateY(${40*(1-e((t-F)/.45))}px)`;
  const d3=t-F; if(d3>=0&&d3<.12) fl=Math.max(fl,.4*(1-d3/.12));
  $('flash').style.opacity=fl;
  $('glow').style.transform=`translate(${30*Math.sin(t*.7)}px,${20*Math.cos(t*.5)}px)`;
  $('grain').style.transform=`translate(${(t*997)%180-90}px,${(t*577)%180-90}px)`;
};render(0);
</script></body></html>
